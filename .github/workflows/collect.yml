name: collect
# 원글 이미지 수집: jobs/<id>/collect.json을 올리면 jobs/<id>/src/에 이미지를 받아 커밋
on:
  push:
    paths: ["jobs/*/collect.json", "scripts/collect.py", "scripts/fetch_util.py"]
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 pillow
      - run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: python3 scripts/collect.py
      - name: commit
        run: |
          git config user.name "humor-cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs
          git diff --cached --quiet && exit 0
          git commit -m "collect: $(TZ=Asia/Seoul date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
