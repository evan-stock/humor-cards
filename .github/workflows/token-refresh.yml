name: instagram-token-refresh
# 인스타 장기 토큰은 60일 뒤 만료된다. 매달 1일·15일 자동 갱신.
# 새 토큰을 저장하려면 Secrets에 GH_PAT(이 저장소 Secrets 쓰기 권한 토큰)가 있어야 한다.
on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 토큰 갱신 후 저장
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python3 -c "import sys; sys.path.insert(0,'scripts'); import instagram; print(instagram.refresh_token())")
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "토큰 갱신 완료"
