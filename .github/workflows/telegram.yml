name: telegram
# 텔레그램 승인: 게시 대기(post.json) 미리보기를 보내고 ✅/❌ 버튼을 받는다. 게시는 publish 워크플로가 한다.
on:
  push:
    paths: ["jobs/*/post.json"]
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/tg_watch.py --minutes 150
